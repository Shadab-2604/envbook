<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Subtle Glow -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#glow)" />

  <!-- Book Spine / Vault Outer Frame -->
  <path d="M16 16 C16 14.895 16.895 14 18 14 L42 14 C44.209 14 46 15.791 46 18 L46 46 C46 48.209 44.209 50 42 50 L18 50 C16.895 50 16 49.105 16 48 Z" fill="#090d16" stroke="#334155" stroke-width="2" />
  
  <!-- Spine Accent -->
  <path d="M22 14 L22 50" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />

  <!-- Code / Terminal Prompt Prompt ">_" -->
  <path d="M27 24 L32 28 L27 32" fill="none" stroke="url(#emerald)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="34" y1="32" x2="40" y2="32" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />

  <!-- Mini Lock / Security Dot Indicator -->
  <circle cx="34" cy="42" r="3" fill="#10b981" />
  <path d="M31.5 42 L31.5 39.5 C31.5 38.1 32.6 37 34 37 C35.4 37 36.5 38.1 36.5 39.5 L36.5 42" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
</svg>
